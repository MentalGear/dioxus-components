[workspace]
resolver = "3"
# `templates/starter` is a cargo-generate template for new apps (`dx new --template ... --subtemplate
# templates/starter`), not a crate of this workspace: keep it out so it never joins a build or a gate.
# Its manifest is `Cargo.toml.liquid` (cargo-generate strips the suffix) so cargo, which scans a git
# dependency's whole tree for manifests, never meets the unrendered `{{project-name}}` placeholder.
exclude = ["templates"]
members = [
    "primitives",
    "cli",
    "preview",
    "test-harness",
    "dioxus-attributes",
    "scripts/attr-spread-collision-checker",
]

[workspace.dependencies]
dioxus-primitives = { path = "primitives" }
tracing = { version = "0.1", features = ["std"] }

dioxus = "0.7.8"
dioxus-rsx = "0.7.8"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

# dx 0.7.9 builds every target under its own profile named `<platform>-<dev|release>`
# (`wasm-release` for the shipped client, `server-release` for the SSG prerender server) and
# passes `--profile <name>` to cargo (dioxus-cli src/platform.rs `profile_name`,
# src/build/request.rs `cargo_build_arguments`). When a profile of that name is absent it is
# synthesized as `inherits = "release"` (+ opt-level "s" for web); when it is defined here dx
# uses OUR definition and injects nothing but `strip=false` (request.rs `profile_args`).
# `server-release` below therefore overrides ONLY the server binary, which prerenders the static
# pages and is never shipped: no LTO, 16 codegen units, low opt-level. It must keep
# `inherits = "release"` (dx's release detection, workspace.rs `is_release_profile`, also keys on
# the `-release` suffix) so debug-assertions/overflow-checks stay off as in today's server build.
# Do NOT add a `[profile.wasm-release]` here without re-deriving the shipped wasm settings: dx
# currently layers `opt-level="s"` onto `wasm-release` via `--config`, a user definition
# replaces that. See dev-docs/backlog.md row 116.
[profile.server-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
debug = 0
strip = false
incremental = true

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
