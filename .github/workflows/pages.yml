name: Pages

# Automatic triggers disabled until further notice (2026-08-30).
# To reactivate, delete the 'on: workflow_dispatch' line and uncomment:
# on:
#   workflow_run:
#     workflows: ["Web"]
#     types: [completed]
#   pull_request:
#     types: [closed]
#
# Chained trigger restored 2026-08-31: Pages may follow a completed Web
# run (Web itself remains manual-only, so no automatic CI results from
# this) and may be dispatched manually.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Web"]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    # The shared workflow only accepts workflow_run events whose upstream
    # build was a push/pull_request — it validates the artifact's own
    # event_name too, so manually dispatched Web builds can never pass it.
    if: github.event_name == 'workflow_run'
    uses: DioxusLabs/dioxus-ci/.github/workflows/pages-publish.yml@60c40430ef69c6d7b92439bc43e281689db1bde7
    with:
      pages-url-base: https://dioxuslabs.github.io

  # Manual path while automatic CI is off: publish the newest successful
  # Web build on main (dispatched builds included) straight to gh-pages.
  publish-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download latest successful Web artifact from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/web.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$run_id"
          echo "Publishing Web run $run_id"
          gh run download "$run_id" -R "${{ github.repository }}" -D artifact
          meta=$(find artifact -name .dioxus-ci-pages.json | head -1)
          test -n "$meta"
          site="$(dirname "$meta")/site"
          test -d "$site"
          echo "SITE_DIR=$site" >> "$GITHUB_ENV"
      - name: Push site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$SITE_DIR"/. pages/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from latest Web build (manual dispatch)" || echo "nothing to deploy"
          git push origin gh-pages
