name: Playwright Tests

# Automatic triggers disabled until further notice (2026-08-30).
# To reactivate, delete the 'on: workflow_dispatch' line and uncomment:
# on:
#   push:
#     branches:
#       - main
#     paths:
#       - /**
#       - playwright/**
#       - preview/**/*.css
#       - preview/**/*.rs
#       - preview/**/Cargo.toml
#       - primitives/**/*.rs
#       - primitives/**/Cargo.toml
#       - .github/**
#       - Cargo.toml
#
#   pull_request:
#     types: [opened, synchronize, reopened, ready_for_review]
#     branches:
#       - main
#     paths:
#       - /**
#       - playwright/**
#       - preview/**/*.css
#       - preview/**/*.rs
#       - preview/**/Cargo.toml
#       - primitives/**/*.rs
#       - primitives/**/Cargo.toml
#       - .github/**
#       - Cargo.toml
#
on: workflow_dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      # Do our best to cache the toolchain and node install steps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: DioxusLabs/dioxus-ci/actions/setup-dioxus@v0.1.0
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown
          cache-on-failure: "true"
      - uses: DioxusLabs/dioxus-ci/actions/install-dioxus-cli@v0.1.0
        with:
          version: 0.7.9
      - name: Install dependencies
        run: cd ./playwright && npm ci
      - name: Install Playwright Browsers
        run: cd ./playwright && npx playwright install --with-deps
      - name: Run Playwright tests
        run: cd ./playwright && npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  # dev-docs/backlog.md rows 22/46: the job above only ever exercises the
  # `dx serve` CSR dev-server lane (`playwright.config.ts`'s own `webServer`)
  # -- it never builds or serves the fullstack-SSG artifact this repo
  # actually deploys (`scripts/deploy-preview.sh`), so a defect that only
  # exists in that build shape (the 2026-09-01 cfg-axis incident,
  # dev-docs/recommended-implementations.md Caveat 1; row 46's query-string
  # SSG-enumeration defect) has no CI signal until deploy. This job is that
  # signal: build the SSG artifact the same way the deploy script does
  # (minus `--base-path`, so it serves at `/` for a local static server, per
  # dev-docs/conformance-harness.md's "SSG lane" recipe), serve it with a
  # plain static file server (no `dx` dev server involved at all, matching
  # how GitHub Pages actually serves it), and run the black-box hydration-
  # parity oracle against that static site. `workflow_dispatch` only, same
  # as `playwright-tests` above -- the CI freeze (row 33) is a user decision
  # this job does not change.
  ssg-hydration-parity:
    if: github.event.pull_request.draft == false
    name: SSG hydration parity
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: DioxusLabs/dioxus-ci/actions/setup-dioxus@v0.1.0
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown
          cache-on-failure: "true"
      - uses: DioxusLabs/dioxus-ci/actions/install-dioxus-cli@v0.1.0
        with:
          version: 0.7.9
      - name: Install dependencies
        run: cd ./playwright && npm ci
      - name: Install Playwright Browsers
        run: cd ./playwright && npx playwright install --with-deps chromium
      - name: Build the fullstack SSG artifact
        # --force-sequential: dx otherwise races its own client and server
        # sub-builds during the SSG render pass (scripts/deploy-preview.sh's
        # own comment on this same flag has the full account).
        run: cd ./preview && dx build --platform web --release --ssg --features fullstack --force-sequential=true
      - name: Serve the SSG output statically
        run: |
          site_dir="$(pwd)/target/dx/preview/release/web/public"
          test -d "$site_dir" || { echo "::error::expected SSG output at $site_dir"; exit 1; }
          echo "SSG_SITE_DIR=$site_dir" >> "$GITHUB_ENV"
          python3 -m http.server 8090 -d "$site_dir" &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/ >/dev/null && exit 0
            sleep 1
          done
          echo "::error::static server on :8090 never came up"
          exit 1
      - name: Run the hydration-parity oracle against the static SSG site
        run: cd ./playwright && npx playwright test --config=ssg.local.config.ts oracle/hydration-parity.spec.ts
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ssg-hydration-parity-report
          path: playwright/playwright-report
          retention-days: 7
