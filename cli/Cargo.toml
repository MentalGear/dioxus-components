[package]
name = "shadcn-dioxus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
description = "Installer for the shadcn-dioxus component registry: add, list, remove and init, forked from `dx components`."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MentalGear/shadcn-dioxus"
readme = "README.md"
# Not published to crates.io: `cargo install --git https://github.com/MentalGear/shadcn-dioxus shadcn-dioxus`.
publish = false

[[bin]]
name = "shadcn-dioxus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
